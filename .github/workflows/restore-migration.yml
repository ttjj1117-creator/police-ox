name: Restore migration archive

on:
  push:
    branches:
      - main
    paths:
      - '.migration/chunk_07'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project from migration chunks
        shell: bash
        run: |
          set -euo pipefail

          test -f .migration/chunk_00
          test -f .migration/chunk_01
          test -f .migration/chunk_02
          test -f .migration/chunk_03
          test -f .migration/chunk_04
          test -f .migration/chunk_05
          test -f .migration/chunk_06
          test -f .migration/chunk_07

          cat .migration/chunk_* > /tmp/police-ox.b64
          base64 --decode /tmp/police-ox.b64 > /tmp/police-ox.zip

          rm -rf /tmp/police-ox-restore
          mkdir -p /tmp/police-ox-restore
          unzip -q /tmp/police-ox.zip -d /tmp/police-ox-restore

          test -f /tmp/police-ox-restore/police-ox/package.json
          test -f /tmp/police-ox-restore/police-ox/src/fixtures/book-taxonomies.json

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/police-ox-restore/police-ox/. .

          rm -rf .migration
          rm -f .github/workflows/restore-migration.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Restore police-ox project from migration archive"
          git push origin HEAD:main
