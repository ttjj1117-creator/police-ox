name: Restore missing project source

on:
  push:
    paths:
      - ".github/workflows/restore-missing-source.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore missing folders
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_COMMIT="0910f3b883dc33268a5ec114f50b32e7315bbcec"
          WORK=/tmp/police-ox-restore
          rm -rf "$WORK"
          mkdir -p "$WORK/chunks" "$WORK/unpacked"

          git show "${ARCHIVE_COMMIT}:.migration/chunk_00" > "$WORK/chunks/chunk_00"
          git show "${ARCHIVE_COMMIT}:.migration/chunk_01" > "$WORK/chunks/chunk_01"
          cp .restore/fix02 "$WORK/chunks/chunk_02"
          git show "${ARCHIVE_COMMIT}:.migration/chunk_03" > "$WORK/chunks/chunk_03"
          cp .restore/fix04 "$WORK/chunks/chunk_04"
          git show "${ARCHIVE_COMMIT}:.migration/chunk_05" > "$WORK/chunks/chunk_05"
          git show "${ARCHIVE_COMMIT}:.migration/chunk_06" > "$WORK/chunks/chunk_06"
          git show "${ARCHIVE_COMMIT}:.migration/chunk_07" > "$WORK/chunks/chunk_07"

          cat "$WORK/chunks/chunk_00" "$WORK/chunks/chunk_01" "$WORK/chunks/chunk_02" "$WORK/chunks/chunk_03" "$WORK/chunks/chunk_04" "$WORK/chunks/chunk_05" "$WORK/chunks/chunk_06" "$WORK/chunks/chunk_07" | tr -d '\r\n' | base64 --decode > "$WORK/project.zip"
          unzip -tq "$WORK/project.zip"
          unzip -q "$WORK/project.zip" -d "$WORK/unpacked"

          rm -rf src tests e2e
          cp -R "$WORK/unpacked/police-ox/src" ./src
          cp -R "$WORK/unpacked/police-ox/tests" ./tests
          cp -R "$WORK/unpacked/police-ox/e2e" ./e2e

          rm -rf .restore
          rm -f .github/workflows/restore-missing-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore missing source, tests, and e2e files"
          git push origin HEAD:main
