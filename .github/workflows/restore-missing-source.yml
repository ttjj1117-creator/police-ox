name: Restore missing project source

on:
  push:
    paths:
      - ".github/workflows/restore-missing-source.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore intact missing folders
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_COMMIT="0910f3b883dc33268a5ec114f50b32e7315bbcec"
          WORK=/tmp/police-ox-restore
          rm -rf "$WORK"
          mkdir -p "$WORK/chunks" "$WORK/unpacked"

          for n in 00 01 02 03 04 05 06 07; do
            git show "${ARCHIVE_COMMIT}:.migration/chunk_${n}" | tr -d '\r\n' > "$WORK/chunks/chunk_${n}"
          done

          python3 - <<'PY'
          from pathlib import Path
          root = Path("/tmp/police-ox-restore/chunks")
          p2 = root / "chunk_02"
          s2 = p2.read_text()
          p2.write_text(s2[:12000] + "1" + s2[12000:])
          p4 = root / "chunk_04"
          s4 = p4.read_text()
          p4.write_text(s4[:20000])
          PY

          cat "$WORK/chunks/chunk_00" "$WORK/chunks/chunk_01" "$WORK/chunks/chunk_02" "$WORK/chunks/chunk_03" "$WORK/chunks/chunk_04" "$WORK/chunks/chunk_05" "$WORK/chunks/chunk_06" "$WORK/chunks/chunk_07" | base64 --decode > "$WORK/project.zip"

          unzip -q "$WORK/project.zip" -d "$WORK/unpacked" || true

          test -f "$WORK/unpacked/police-ox/src/domain/schema.ts"
          test -f "$WORK/unpacked/police-ox/src/fixtures/book-taxonomies.json"
          test -f "$WORK/unpacked/police-ox/tests/core.test.ts"
          test -f "$WORK/unpacked/police-ox/e2e/app.spec.ts"
          test "$(wc -c < "$WORK/unpacked/police-ox/src/fixtures/book-taxonomies.json")" -eq 308620

          rm -rf src tests e2e
          cp -R "$WORK/unpacked/police-ox/src" ./src
          cp -R "$WORK/unpacked/police-ox/tests" ./tests
          cp -R "$WORK/unpacked/police-ox/e2e" ./e2e
          rm -f src/fixtures/data.ts

          rm -rf .restore .restore2
          rm -f .github/workflows/restore-missing-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore missing source, tests, and e2e files"
          git push origin HEAD:main
